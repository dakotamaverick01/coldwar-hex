<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bridge Mission Map</title>
<style>
  :root { --ink:#eef1ea; --ink-dim:rgba(238,241,234,.72); --panel:rgba(16,20,22,.58); --panel-edge:rgba(255,255,255,.14); --accent:#e9c27a; --accent-ink:#1d1a12; }
  html, body { margin:0; height:100%; background:#14181c; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  body { font:15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color:var(--ink); }
  #top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0; pointer-events:none; }
  #title { font-weight:700; font-size:15px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #note { margin-top:4px; font-size:12px; color:var(--ink-dim); text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #bottom { position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px); display:flex; align-items:flex-end; justify-content:space-between; gap:8px; pointer-events:none; }
  .views { display:flex; gap:8px; pointer-events:auto; }
  .views button { min-height:48px; padding:0 16px; border-radius:24px; border:1px solid var(--panel-edge); background:var(--panel); color:var(--ink); font:600 14px/1 inherit; font-family:inherit; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); cursor:pointer; }
  .views button.on { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  #stats { position:fixed; right:16px; top:calc(env(safe-area-inset-top,0px) + 56px); font:11px/1.3 ui-monospace, Menlo, monospace; color:var(--ink-dim); text-align:right; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap; }
  #hint { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 74px); transform:translateX(-50%); background:var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:8px 12px; font-size:12.5px; color:var(--ink); text-align:center; width:max-content; max-width:calc(100vw - 32px); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); pointer-events:none; transition:opacity 1s; }
  .tag { position:fixed; left:0; top:0; pointer-events:none; font:700 10px/1 -apple-system, system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#1d1a12; background:#f0d9a0; border-radius:6px; padding:4px 6px; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.4); display:none; }
  #err { position:fixed; inset:auto 16px 50% 16px; background:#5a1d1d; color:#fff; padding:12px; border-radius:10px; font-size:13px; display:none; }
</style>
</head>
<body>
<div id="top">
  <div id="title">Bridge mission map (test)</div>
  <div id="note">Real Hof elevation and a river line traced from it. Bridge and roads are stand-ins.</div>
</div>
<div id="hint">Drag to turn · pinch to zoom · two fingers to slide<br>Touch the land to light up the hexes</div>
<div id="bottom">
  <div class="views">
    <button id="vOver">Overview</button>
    <button id="vLow">Bridge view</button>
    <button id="vGrid" class="on">Grid</button>
  </div>
  <div id="stats"></div>
</div>
<div class="tag" id="tag0">Stand-in bridge</div>
<div class="tag" id="tag1">Village</div>
<div class="tag" id="tag2">Farm</div>
<div id="err"></div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Error: ' + (e.message || e);
});

const params = new URLSearchParams(location.search);
const FIXED_PR = params.has('pr') ? parseFloat(params.get('pr')) : null;   // for testing: lock the resolution

function hash2(ix, iz) {
  let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}
function fbm(x, z) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; }
  return s / 0.9375;
}
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
/* ============================================================
   2. RENDERER, SCENE, CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;      // tone mapping is done in our own final pass
document.body.prepend(renderer.domElement);
const gl = renderer.getContext();
const canHalf = renderer.extensions.has('EXT_color_buffer_half_float') || renderer.extensions.has('EXT_color_buffer_float');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.2, 1400);

/* Shared uniforms: every material reads the same objects, so a look change updates everything at once. */
const U = {
  uTime:     { value: 0 },
  uFogCol:   { value: new THREE.Color() },
  uSunCol:   { value: new THREE.Color() },
  uSunDir:   { value: new THREE.Vector3(0, 1, 0) },
  uFogDens:  { value: 0.01 },
  uHFogA:    { value: 0.2 },
  uHFogB:    { value: 1.4 },
  uHFogH:    { value: 0.9 },
  uFogPatch: { value: 1 },
  uWind:     { value: 1 },
  uTouch:    { value: new THREE.Vector3(0, 0, 0) },
  uTouchAmt: { value: 0 },
  uHexW:     { value: 10.0 },
  uGridAll:  { value: 1 },
  uRoadTex:  { value: null },
  uZenith:   { value: new THREE.Color() },
  uHorizon:  { value: new THREE.Color() },
  uMist:     { value: 0.5 },
  uSandy:    { value: 0 },
  uTuftFar:  { value: 26 },
  uCloud:    { value: 0.22 },
};

const GLSL_FOG = /* glsl */`
uniform float uTime; uniform vec3 uFogCol; uniform vec3 uSunCol; uniform vec3 uSunDir;
uniform float uFogDens; uniform float uHFogA; uniform float uHFogB; uniform float uHFogH; uniform float uFogPatch;
float lt_hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float lt_noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(lt_hash(i), lt_hash(i+vec2(1,0)), u.x), mix(lt_hash(i+vec2(0,1)), lt_hash(i+vec2(1,1)), u.x), u.y); }
uniform float uCloud;
float cloudShade(vec3 wp){ vec2 p = wp.xz*0.011 + vec2(uTime*0.006, uTime*0.0025);
  float n = lt_noise(p)*0.6 + lt_noise(p*2.3 + 5.0)*0.4;
  return 1.0 - uCloud * smoothstep(0.5, 0.72, n); }
vec3 fogColAt(vec3 rd){
  float s = pow(max(dot(rd, uSunDir), 0.0), 5.0);
  return mix(uFogCol, uFogCol*0.5 + uSunCol*0.3, s);
}
vec3 applyFog(vec3 col, vec3 wp){
  vec3 v = wp - cameraPosition; float dist = length(v); vec3 rd = v / max(dist, 1e-4);
  float b = uHFogB;
  float y0 = cameraPosition.y - uHFogH;
  float y1 = wp.y - uHFogH;
  float e0 = exp(-b*clamp(y0, -6.0, 40.0));
  float e1 = exp(-b*clamp(y1, -6.0, 40.0));
  float dy = wp.y - cameraPosition.y;
  float hf = abs(dy) > 0.01 ? uHFogA * dist * (e0 - e1) / (b * dy) : uHFogA * dist * e0;
  float patchy = mix(1.0, 0.25 + 1.5*lt_noise(wp.xz*0.11 + vec2(uTime*0.035, uTime*0.013)), uFogPatch);
  hf *= patchy;
  float far = pow(dist/470.0, 4.0);
  float tot = 1.0 - exp(-(max(dist - 90.0, 0.0)*uFogDens*1.6 + max(hf, 0.0) + far));
  return mix(col, fogColAt(rd), clamp(tot, 0.0, 1.0));
}`;

const GLSL_HEX = /* glsl */`
uniform vec3 uTouch; uniform float uTouchAmt; uniform float uHexW; uniform float uGridAll;
float hexDist(vec2 p){ p = abs(p); return max(dot(p, vec2(0.5, 0.8660254)), p.x); }
vec4 hexCoords(vec2 uv){ vec2 r = vec2(1.0, 1.7320508); vec2 h = r*0.5;
  vec2 a = mod(uv, r) - h; vec2 b = mod(uv - h, r) - h;
  vec2 gv = dot(a,a) < dot(b,b) ? a : b; return vec4(gv, uv - gv); }`;

/* Ground detail, drawn per pixel: grass and sandy patches, crop rows, dirt roads with wheel ruts, railway ballast. */
const f1 = (v) => v.toFixed(4);
const GLSL_GROUND_DETAIL = /* glsl */`{
  // ---- Shared ground look (any map): macro colour drift, grass, crisp field patchwork with margins,
  //      forest floor, roads with verges, fine grain. Inputs: vertex colour (base), vKind (x open grass,
  //      y field, z forest), uRoadTex (distance to roads). Everything is procedural: no image files.
  vec2 xz = vWPos.xz;
  float camD = distance(cameraPosition, vWPos);
  float near = 1.0 - smoothstep(25.0, 70.0, camD);
  float n1 = lt_noise(xz*1.3), n2 = lt_noise(xz*5.1 + 3.0), n3 = lt_noise(xz*21.0 + 9.0);
  float m1 = lt_noise(xz*0.022 + 2.0), m2 = lt_noise(xz*0.085 - 5.0);
  vec3 base = diffuseColor.rgb;
  base *= mix(vec3(1.08, 1.03, 0.84), vec3(0.88, 1.02, 1.02), m1);   // drier vs lusher ground
  base *= 0.88 + 0.24*m2;
  // open grass: mostly grass, a few small bare patches
  float pm = lt_noise(xz*0.45 + 7.0)*0.55 + n1*0.45;
  vec3 sandC = vec3(0.34, 0.28, 0.17) * (0.9 + 0.2*n2);
  vec3 openC = mix(base * (0.86 + 0.28*n2), sandC, smoothstep(0.63, 0.82, pm) * 0.5 * uSandy);
  // up close: grass streaks and dry tufts
  float n4 = lt_noise(vec2(xz.x*38.0 + xz.y*9.0, xz.y*14.0 - xz.x*3.0));
  openC *= mix(1.0, 0.82 + 0.34*n4, near);
  openC = mix(openC, openC * vec3(1.25, 1.12, 0.7), smoothstep(0.55, 0.8, lt_noise(xz*2.3 + 4.0)) * 0.35);
  base = mix(base, openC, vKind.x);
  // fields: farmland parcels (24 units) with their own direction, cut into long strip fields of varied
  //         width and length, the way Franconian farmland looks from the air; some parcels are whole meadows
  vec2 wq = xz + (vec2(lt_noise(xz*0.04 + 1.7), lt_noise(xz*0.04 - 3.1)) - 0.5) * 3.0;
  float PS = 24.0;
  float prow = floor(wq.y / PS);
  float poff = lt_hash(vec2(prow, 1.7)) * PS;
  vec2 pid = vec2(floor((wq.x + poff) / PS), prow);
  vec2 pl = vec2(fract((wq.x + poff) / PS), fract(wq.y / PS)) * PS;
  float pEdge = min(min(pl.x, PS - pl.x), min(pl.y, PS - pl.y));
  float ang = (lt_hash(pid + 2.3) - 0.5) * 1.4 + 0.35;
  vec2 dir = vec2(cos(ang), sin(ang)), per = vec2(-dir.y, dir.x);
  float sw = 1.6 + 2.6 * lt_hash(pid + 5.1);
  float sA = dot(wq, per) / sw, sid = floor(sA);
  float sl = 7.0 + 9.0 * lt_hash(vec2(sid, pid.x + pid.y * 13.0));
  float sL = dot(wq, dir) / sl + lt_hash(vec2(sid, pid.y)) * 3.0, lid = floor(sL);
  vec2 fidv = vec2(sid + pid.x * 31.0, lid + pid.y * 17.0);
  float meadowParcel = step(lt_hash(pid + 9.9), 0.28);
  float h1 = mix(lt_hash(fidv + 0.37), 0.75, meadowParcel), h2 = lt_hash(fidv + 7.71);
  vec3 fc = h1 < 0.18 ? vec3(0.090, 0.058, 0.034)      // ploughed
          : h1 < 0.36 ? vec3(0.290, 0.218, 0.105)      // stubble
          : h1 < 0.58 ? vec3(0.088, 0.160, 0.042)      // winter crop
          : h1 < 0.85 ? vec3(0.128, 0.170, 0.062)      // pasture
          :             vec3(0.185, 0.150, 0.078);     // fallow
  fc *= 0.86 + 0.28*h2;
  float along = dot(wq, dir);
  float rows = 0.5 + 0.5*sin(along * 30.0);
  float fadeR = 1.0 - smoothstep(0.8, 2.0, fwidth(along) * 30.0);
  fc *= 1.0 + (rows - 0.5) * 0.3 * fadeR * (h1 < 0.58 ? 1.0 : 0.2);
  fc *= 0.9 + 0.2*n2;
  float eA = min(fract(sA), 1.0 - fract(sA)) * sw, eL = min(fract(sL), 1.0 - fract(sL)) * sl;
  float ed = mix(min(min(eA, eL), pEdge), pEdge, meadowParcel), efw = fwidth(ed);
  float vis = 1.0 - smoothstep(0.05, 0.3, efw);
  float margin = (1.0 - smoothstep(0.07, 0.09 + efw*1.5, ed)) * vis;
  float lane = (1.0 - smoothstep(0.18, 0.22 + efw*1.5, pEdge)) * vis;      // wider grass lanes between parcels
  fc = mix(fc, vec3(0.075, 0.115, 0.032) * (0.8 + 0.4*n2), max(margin, lane));
  base = mix(base, fc, vKind.y);
  // forest floor: dark, mottled needle litter and shade
  vec3 floorC = vec3(0.045, 0.052, 0.022) * (0.7 + 0.6*lt_noise(xz*0.8 + 1.0));
  base = mix(base, floorC, smoothstep(0.12, 0.55, vKind.z));
  // roads: packed dirt with wheel ruts and a dry trampled verge
  vec2 ruv = (xz - vec2(-200.0, -220.0)) / vec2(400.0, 440.0);
  vec4 rt = texture2D(uRoadTex, ruv);
  float roadD = rt.r, sideD = rt.g;
  float roadM = 1.0 - smoothstep(0.27, 0.31 + fwidth(roadD)*1.5, roadD);
  float sideM = 1.0 - smoothstep(0.18, 0.22 + fwidth(sideD)*1.5, sideD);
  float verge = (1.0 - smoothstep(0.30, 0.6, min(roadD, sideD + 0.08))) * (1.0 - max(roadM, sideM));
  base = mix(base, base * vec3(1.3, 1.18, 0.82) + vec3(0.02, 0.015, 0.0), verge * 0.55);
  float ruts = (1.0 - smoothstep(0.012, 0.035, abs(roadD - 0.14))) * roadM
             + (1.0 - smoothstep(0.010, 0.03, abs(sideD - 0.09))) * sideM;
  vec3 dirtC = vec3(0.26, 0.21, 0.145) * (0.85 + 0.3*n2) * (0.94 + 0.12*n3);
  base = mix(base, dirtC, max(roadM, sideM));
  base *= 1.0 - 0.28 * ruts;
  // fine grain, only up close where it can be seen without shimmer
  base *= 1.0 + ((n2 - 0.5)*0.14 + (n3 - 0.5)*0.12) * mix(0.35, 1.0, near);
  diffuseColor.rgb = base;
}`;

/* Adds our fog (and optional wind, wet ground, hex grid) to a standard three.js material. */
function patch(mat, opt = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        uniform float uTime; uniform float uWind;
        ${opt.wet ? 'attribute float aWet; varying float vWet;' : ''}
        ${opt.ground ? 'attribute vec4 aKind; varying vec4 vKind;' : ''}
        ${opt.tuft ? 'uniform float uTuftFar;' : ''}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        ${opt.wind ? `{
          #ifdef USE_INSTANCING
            vec2 ip = vec2(instanceMatrix[3].x, instanceMatrix[3].z);
          #else
            vec2 ip = vec2(0.0);
          #endif
          float gust = 0.55 + 0.45*sin(uTime*0.7 - (ip.x*0.8 + ip.y*0.5)*0.18);
          float sway = (sin(uTime*1.9 + ip.x*0.7 + ip.y*0.4) + 0.45*sin(uTime*3.3 + ip.x*1.7)) * gust * uWind;
          float k = max(transformed.y, 0.0); k *= k;
          transformed.x += sway * k * 0.07;
          transformed.z += sway * k * 0.035;
        }` : ''}
        ${opt.flutter ? `transformed += vec3(sin(uTime*5.0 + position.x*45.0 + position.y*30.0), sin(uTime*6.1 + position.z*40.0)*0.5, cos(uTime*4.3 + position.z*45.0)) * 0.004 * max(transformed.y, 0.0);` : ''}
        ${opt.tuft ? `{
          #ifdef USE_INSTANCING
            vec3 ipos = (modelMatrix * vec4(instanceMatrix[3].xyz, 1.0)).xyz;
            transformed *= 1.0 - smoothstep(uTuftFar * 0.6, uTuftFar, distance(cameraPosition, ipos));
          #endif
        }` : ''}`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        { vec4 wp4 = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            wp4 = instanceMatrix * wp4;
          #endif
          vWPos = (modelMatrix * wp4).xyz; }
        ${opt.wet ? 'vWet = aWet;' : ''}
        ${opt.ground ? 'vKind = aKind;' : ''}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        ${opt.wet ? 'varying float vWet;' : ''}
        ${opt.ground ? 'varying vec4 vKind; uniform float uSandy; uniform sampler2D uRoadTex;' : ''}
        ${GLSL_FOG}
        ${opt.hex ? GLSL_HEX : ''}`)
      .replace('#include <fog_fragment>', `gl_FragColor.rgb = applyFog(gl_FragColor.rgb * cloudShade(vWPos), vWPos);`);
    if (opt.ground) sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      ${GLSL_GROUND_DETAIL}`);
    if (opt.wet) {
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <color_fragment>', `#include <color_fragment>
          diffuseColor.rgb *= 1.0 - 0.28*vWet;`)
        .replace('#include <roughnessmap_fragment>', `float roughnessFactor = roughness * (1.0 - 0.42*vWet);`);
    }
    if (opt.hex) {
      sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', `#include <opaque_fragment>
        if (uTouchAmt > 0.001 || uGridAll > 0.001) {
          vec4 hc = hexCoords(vWPos.xz / uHexW);
          float e = 0.5 - hexDist(hc.xy);
          float fw = fwidth(e);
          float line = 1.0 - smoothstep(fw*0.3, fw*1.1 + 0.004, e);
          float halo = 1.0 - smoothstep(fw*0.5, fw*2.0 + 0.03, e);
          vec4 tc = hexCoords(uTouch.xz / uHexW);
          float sel = 1.0 - step(0.05, length(tc.zw - hc.zw));
          float r = length(vWPos.xz - uTouch.xz);
          float inB = step(abs(vWPos.x), 160.0) * step(abs(vWPos.z), 177.0);
          float m = max(uTouchAmt * (1.0 - smoothstep(uHexW*1.3, uHexW*3.3, r)), uGridAll*0.45) * inB * (1.0 - 0.5*smoothstep(110.0, 230.0, distance(cameraPosition, vWPos)));
          gl_FragColor.rgb *= mix(1.0, 0.8, uGridAll * (1.0 - inB));
          vec3 lc = vec3(1.0, 0.88, 0.62) * 1.5;
          gl_FragColor.rgb *= 1.0 - 0.35 * halo * m;
          gl_FragColor.rgb = mix(gl_FragColor.rgb, lc, line * m * 0.6);
          gl_FragColor.rgb += lc * 0.10 * sel * uTouchAmt * inB;
        }`);
    }
  };
  mat.customProgramCacheKey = () => 'p' + JSON.stringify(opt);
  return mat;
}
function patchDepth(mat) {   // wind in the shadow pass too, so shadows sway with the trees
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uWind = U.uWind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uWind;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        { vec2 ip = vec2(instanceMatrix[3].x, instanceMatrix[3].z);
          float gust = 0.55 + 0.45*sin(uTime*0.7 - (ip.x*0.8 + ip.y*0.5)*0.18);
          float sway = (sin(uTime*1.9 + ip.x*0.7 + ip.y*0.4) + 0.45*sin(uTime*3.3 + ip.x*1.7)) * gust * uWind;
          float k = max(transformed.y, 0.0); k *= k;
          transformed.x += sway * k * 0.07; transformed.z += sway * k * 0.035; }`);
  };
  return mat;
}

/* ============================================================
   3. LIGHTS
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 400 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

/* ============================================================
   4. SKY
   ============================================================ */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `${GLSL_FOG}
      uniform vec3 uZenith; uniform vec3 uHorizon; varying vec3 vDir;
      void main(){

    if (t) for (const p of t.path.slice(1)) list.push({ r: p.r, c: p.c, col: p === t.path[t.path.length - 1] ? [0.95, 0.7, 0.1, 0.85] : [0.9, 0.9, 0.9, 0.6] });
    list.push({ r: u.r, c: u.c, col: [0.9, 0.55, 0.05, 0.7] });
  }
  setHighlights(list);
}

/* ---- the little HUD ---- */
const hudCss = document.createElement('style');
hudCss.textContent = `
#gTurn { position:fixed; left:16px; top:calc(env(safe-area-inset-top,0px) + 52px); background:var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:7px 12px; font-weight:700; font-size:14px; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); pointer-events:none; }
#gTurn small { display:block; font-weight:500; font-size:11px; color:var(--ink-dim); }
#gEnd { position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 72px); min-height:48px; padding:0 20px; border-radius:24px; border:0; background:var(--accent); color:var(--accent-ink); font:700 15px/1 inherit; font-family:inherit; }
#gCard { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 130px); background:var(--panel); border:1px solid var(--panel-edge); border-radius:14px; padding:10px 14px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); display:none; pointer-events:none; }
#gCard b { font-size:15px; } #gCard .l2 { font-size:12px; color:var(--ink-dim); margin-top:2px; } #gCard .pips { float:right; font-size:18px; letter-spacing:3px; color:var(--accent); }
`;
document.head.appendChild(hudCss);
const mk = (tag, id, html) => { const e = document.createElement(tag); e.id = id; if (html) e.innerHTML = html; document.body.appendChild(e); return e; };
const gTurn = mk('div', 'gTurn'), gCard = mk('div', 'gCard'), gEnd = mk('button', 'gEnd', 'End turn');
const tBtn = document.createElement('button'); tBtn.textContent = 'Terrain'; document.querySelector('.views').appendChild(tBtn);
tBtn.addEventListener('click', () => { gameState.terrainView = !gameState.terrainView; tBtn.classList.toggle('on', gameState.terrainView); refreshHighlights(); });
document.getElementById('note').textContent = 'Tap a vehicle, tap a blue hex to preview the route, tap it again to drive there.';
function hud() {
  const m = gameState.minutes, hh = String(Math.floor(m / 60)).padStart(2, '0'), mm = String(m % 60).padStart(2, '0');
  gTurn.innerHTML = `Turn ${gameState.turn} of 12<small>${hh}:${mm} · day 1</small>`;
  const u = gameState.selected;
  if (!u) { gCard.style.display = 'none'; return; }
  const t = gameState.target;
  const pips = '●'.repeat(Math.max(0, Math.ceil(u.ap - 1e-6))) + '○'.repeat(Math.max(0, AP_MAX - Math.ceil(u.ap - 1e-6)));
  gCard.style.display = 'block';
  gCard.innerHTML = `<span class="pips">${pips}</span><b>${u.call}</b> · ${u.kind.label}<div class="l2">${u.leader} · ${rate(u, false)} hexes per action point off road, ${rate(u, true)} on road, 1 in woods or village${t ? ` · <b style="color:var(--accent)">Tap again to drive (${t.cost.toFixed(1)} AP)</b>` : ''}</div>`;
}
function select(u) {
  gameState.selected = u; gameState.target = null;
  gameState.reach = u ? reachable(u) : null;
  refreshHighlights(); hud();
}
function endTurn() {
  if (gameState.moving) return;
  gameState.turn++; gameState.minutes += 3;
  for (const u of units) u.ap = AP_MAX;
  select(null); hud();
}
gEnd.addEventListener('click', endTurn);

/* ---- tap handling (a tap is a short touch that barely moves; drags keep turning the camera) ---- */
let tapStart = null, tapBad = false;
canvas.addEventListener('pointerdown', (e) => { if (pointers.size > 1) tapBad = true; if (pointers.size === 1) { tapBad = false; tapStart = { x: e.clientX, y: e.clientY, t: performance.now() }; } });
canvas.addEventListener('pointerup', (e) => {
  if (!tapStart || tapBad) { tapStart = null; return; }
  const ok = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 10 && performance.now() - tapStart.t < 450;
  tapStart = null; if (ok) onTap(e.clientX, e.clientY);
});
const _v = new THREE.Vector3();
function onTap(sx, sy) {
  if (gameState.moving) return;
  // nearest vehicle on screen
  let hit = null, bd = 38;
  for (const u of units) {
    _v.set(u.x, height(u.x, u.z) + 1.2, u.z).project(camera);
    if (_v.z > 1) continue;
    const d = Math.hypot((_v.x * 0.5 + 0.5) * innerWidth - sx, (-_v.y * 0.5 + 0.5) * innerHeight - sy);
    if (d < bd) { bd = d; hit = u; }
  }
  if (hit) { select(hit === gameState.selected ? null : hit); return; }
  const p = pickGround(sx, sy); if (!p) { select(null); return; }
  const h = HX.pointToHex(p.x, p.z), k = HXK(h.r, h.c), u = gameState.selected;
  if (u && gameState.reach.best.has(k)) {
    const t = gameState.target;
    if (t && t.r === h.r && t.c === h.c) { startMove(u, t); return; }
    gameState.target = { r: h.r, c: h.c, path: pathTo(u, gameState.reach, h.r, h.c), cost: gameState.reach.best.get(k) };
    refreshHighlights(); hud(); return;
  }
  const occ = unitAt(h.r, h.c); if (occ) { select(occ); return; }
  select(null);
}
function startMove(u, t) {
  const pts = t.path.map((p) => HX.hexCenter(p.r, p.c));
  gameState.moving = u;
  u.path = { pts, i: 0, seg: 0, dest: { r: t.r, c: t.c }, cost: t.cost };
  gameState.target = null; setHighlights([]); gCard.style.display = 'none';
}
window.__lt.camera = camera; window.__lt.hl = hlMesh;
window.__lt.game = { units, TERR, gameState, select, endTurn, reachable, terrAt, onTap, startMove, hex: HX };

/* called every frame from the main loop */
function gameTick(dt) {
  const u = gameState.moving;
  if (u && u.path) {
    const P = u.path, speed = u.kind.fast ? 34 : 24;
    let step = speed * dt;
    while (step > 0 && P.i < P.pts.length - 1) {
      const a = P.pts[P.i], b = P.pts[P.i + 1], L = Math.hypot(b.x - a.x, b.z - a.z) || 1e-6, left = L - P.seg;
      const want = Math.atan2(b.z - a.z, b.x - a.x);
      let dy = want - u.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); u.yaw += dy * Math.min(1, dt * 9);
      if (step >= left) { step -= left; P.i++; P.seg = 0; } else { P.seg += step; step = 0; }
    }
    if (P.i >= P.pts.length - 1) { const e = P.pts[P.pts.length - 1]; u.x = e.x; u.z = e.z; }
    else { const a = P.pts[P.i], b = P.pts[P.i + 1], L = Math.hypot(b.x - a.x, b.z - a.z) || 1, k = P.seg / L; u.x = a.x + (b.x - a.x) * k; u.z = a.z + (b.z - a.z) * k; }
    if (P.i >= P.pts.length - 1) {
      u.r = P.dest.r; u.c = P.dest.c; u.ap = Math.max(0, u.ap - P.cost); if (u.ap < 0.02) u.ap = 0;
      u.path = null; gameState.moving = null;
      select(u);
    }
    placeUnit(u);
  }
  // badges stay about the same size on screen whether zoomed out or in
  const bw = Math.max(1.5, Math.min(5, cam.dist * 0.036));
  for (const v of units) { v.badge.scale.set(bw, bw * 0.56, 1); v.badge.position.y = 2.0 + bw * 0.5; v.badge.material.opacity = v.ap > 0 || v === gameState.selected ? 1 : 0.55; }
}
hud();

renderer.setAnimationLoop(frame);
window.__lt.pause = () => renderer.setAnimationLoop(null);
window.__lt.resume = () => { lastT = performance.now(); renderer.setAnimationLoop(frame); };
</script>
</body>
