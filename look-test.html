<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Look Test</title>
<style>
  :root {
    --ink: #eef1ea;
    --ink-dim: rgba(238, 241, 234, .72);
    --panel: rgba(16, 20, 22, .58);
    --panel-edge: rgba(255, 255, 255, .14);
    --accent: #e9c27a;
    --accent-ink: #1d1a12;
  }
  html, body { margin: 0; height: 100%; background: #14181c; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  body { font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink); }

  #top { position: fixed; left: 0; right: 0; top: 0;
         padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0; pointer-events: none; }
  #looks { display: flex; gap: 8px; pointer-events: auto; }
  #looks button {
    flex: 1; min-height: 60px; border-radius: 14px; border: 1px solid var(--panel-edge);
    background: var(--panel); color: var(--ink); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font: inherit; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; cursor: pointer; transition: background .2s, color .2s;
  }
  #looks button b { font-size: 24px; line-height: 1; letter-spacing: .02em; }
  #looks button span { font-size: 11px; opacity: .85; white-space: nowrap; }
  #looks button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  #note { margin-top: 8px; font-size: 12px; color: var(--ink-dim); text-align: center;
          text-shadow: 0 1px 3px rgba(0,0,0,.7); }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0;
            padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
            display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; pointer-events: none; }
  .views { display: flex; gap: 8px; pointer-events: auto; }
  .views button { min-height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid var(--panel-edge);
                  background: var(--panel); color: var(--ink); font: 600 14px/1 inherit; font-family: inherit;
                  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); cursor: pointer; }
  #stats { position: fixed; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 112px); font: 11px/1.3 ui-monospace, Menlo, monospace; color: var(--ink-dim); text-align: right;
           text-shadow: 0 1px 2px rgba(0,0,0,.8); white-space: nowrap; }

  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: translateX(-50%);
          background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px; padding: 8px 12px;
          font-size: 12.5px; color: var(--ink); text-align: center; width: max-content; max-width: calc(100vw - 32px);
          -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none; transition: opacity 1s; }
  .tag { position: fixed; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -100%);
         font: 700 10px/1 -apple-system, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase;
         color: #1d1a12; background: #f0d9a0; border-radius: 6px; padding: 4px 6px; white-space: nowrap;
         box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px;
                border: 4px solid transparent; border-bottom: 0; border-top-color: #f0d9a0; }
  #err { position: fixed; inset: auto 16px 50% 16px; background: #5a1d1d; color: #fff; padding: 12px; border-radius: 10px;
         font-size: 13px; display: none; }
</style>
</head>
<body>
<div id="top">
  <div id="looks">
    <button data-look="D" class="on"><b>D</b><span>Clear morning</span></button>
    <button data-look="A"><b>A</b><span>Misty dawn</span></button>
    <button data-look="B"><b>B</b><span>Miniature</span></button>
    <button data-look="C"><b>C</b><span>Painterly</span></button>
  </div>
  <div id="note">Stand-in land made by code, shaped like the Hof Gap. Real map data comes later.</div>
</div>
<div id="hint">Drag to turn · pinch to zoom · two fingers to slide<br>Touch the land to see the hex grid</div>
<div id="bottom">
  <div class="views">
    <button id="vOver">Overview</button>
    <button id="vLow">Low view</button>
  </div>
  <div id="stats"></div>
</div>
<div class="tag" id="tag0">Placeholder tank</div>
<div class="tag" id="tag1">Placeholder tank</div>
<div id="err"></div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Error: ' + (e.message || e);
});

const params = new URLSearchParams(location.search);
const FIXED_PR = params.has('pr') ? parseFloat(params.get('pr')) : null;   // for testing: lock the resolution

/* ============================================================
   1. LAND SHAPE (made by code). Same function drives the mesh,
      tree placement, camera ground clamp and touch picking.
   ============================================================ */
function hash2(ix, iz) {
  let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}
function fbm(x, z) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; }
  return s / 0.9375;
}
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;

const riverZ  = (x) => 3.2 * Math.sin(x * 0.11 + 0.4) + 1.3 * Math.sin(x * 0.29 + 1.7);
const riverDZ = (x) => 3.2 * 0.11 * Math.cos(x * 0.11 + 0.4) + 1.3 * 0.29 * Math.cos(x * 0.29 + 1.7);
const riverDist = (x, z) => { const dz = riverDZ(x); return Math.abs(z - riverZ(x)) / Math.sqrt(1 + dz * dz); };
const floorY = (x) => 0.25 + 0.12 * Math.sin(x * 0.09);
const WATER_DROP = 0.15;
const roadZ = (x) => riverZ(x) + 2.4 + 0.5 * Math.sin(x * 0.17);
const VILLAGE = { x: 5, z: riverZ(5) + 3.4 };
// railway: runs along the south side of the valley
const railZ = (x) => riverZ(x) - 2.8;
const railDist = (x, z) => { const dz = riverDZ(x); return Math.abs(z - railZ(x)) / Math.sqrt(1 + dz * dz); };
// side road: leaves the main road, crosses the river on a stone bridge, climbs the south slope
const BX = -0.5, BZ = riverZ(BX), SIDE_K = 0.12;
const sideX = (z) => BX + SIDE_K * (z - BZ);
const sideDist = (x, z) => (z > roadZ(BX) + 0.1 || z < BZ - 9) ? 99 : Math.abs(x - sideX(z)) / Math.sqrt(1 + SIDE_K * SIDE_K);

function height(x, z) {
  const d = riverDist(x, z);
  const side = z > riverZ(x) ? 1 : 1.25;
  const F = floorY(x);
  const ridge = smooth(2.5, 15, d) * (4.4 + 1.8 * fbm(x * 0.05 + 3, z * 0.05)) * side;
  const relief = (fbm(x * 0.11, z * 0.11) - 0.5) * 2.4 * smooth(1.5, 9, d);
  const cr = 1 - Math.abs(fbm(x * 0.07 + 7, z * 0.07 + 1) * 2 - 1);
  const crest = cr * cr * cr * 1.6 * smooth(6, 14, d);
  let h = F + ridge + relief + crest;
  h += (fbm(x * 0.3, z * 0.3) - 0.5) * 0.18 * smooth(1.0, 2.2, d);
  h -= 0.45 * (1 - smooth(0.35, 1.0, d));
  const vd = Math.hypot(x - VILLAGE.x, z - VILLAGE.z);
  h = mix(h, F + 0.22, 1 - smooth(1.8, 3.4, vd));
  h = mix(h, F + 0.16, 1 - smooth(0.35, 0.9, railDist(x, z)));   // railway embankment
  return h;
}
function forestAmount(x, z) {
  const d = riverDist(x, z);
  const fm = fbm(x * 0.09 + 11, z * 0.09 - 4) + smooth(3.5, 11, d) * 0.55;
  const vd = Math.hypot(x - VILLAGE.x, z - VILLAGE.z);
  let f = smooth(0.6, 0.7, fm);
  f *= smooth(2.4, 3.2, d);                       // keep river banks open
  f *= smooth(3.4, 4.4, vd);                      // keep village open
  f *= smooth(0.35, 0.6, Math.abs(z - roadZ(x)));  // keep road open
  f *= smooth(0.7, 1.3, railDist(x, z));           // keep railway open
  f *= smooth(0.4, 0.8, sideDist(x, z));           // keep side road open
  return f;
}

/* ============================================================
   2. RENDERER, SCENE, CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;      // tone mapping is done in our own final pass
document.body.prepend(renderer.domElement);
const gl = renderer.getContext();
const canHalf = renderer.extensions.has('EXT_color_buffer_half_float') || renderer.extensions.has('EXT_color_buffer_float');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 420);

/* Shared uniforms: every material reads the same objects, so a look change updates everything at once. */
const U = {
  uTime:     { value: 0 },
  uFogCol:   { value: new THREE.Color() },
  uSunCol:   { value: new THREE.Color() },
  uSunDir:   { value: new THREE.Vector3(0, 1, 0) },
  uFogDens:  { value: 0.01 },
  uHFogA:    { value: 0.2 },
  uHFogB:    { value: 1.4 },
  uHFogH:    { value: 0.9 },
  uFogPatch: { value: 1 },
  uWind:     { value: 1 },
  uTouch:    { value: new THREE.Vector3(0, 0, 0) },
  uTouchAmt: { value: 0 },
  uHexW:     { value: 2.0 },
  uZenith:   { value: new THREE.Color() },
  uHorizon:  { value: new THREE.Color() },
  uMist:     { value: 0.5 },
  uSandy:    { value: 0 },
  uTuftFar:  { value: 26 },
};

const GLSL_FOG = /* glsl */`
uniform float uTime; uniform vec3 uFogCol; uniform vec3 uSunCol; uniform vec3 uSunDir;
uniform float uFogDens; uniform float uHFogA; uniform float uHFogB; uniform float uHFogH; uniform float uFogPatch;
float lt_hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float lt_noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(lt_hash(i), lt_hash(i+vec2(1,0)), u.x), mix(lt_hash(i+vec2(0,1)), lt_hash(i+vec2(1,1)), u.x), u.y); }
vec3 fogColAt(vec3 rd){
  float s = pow(max(dot(rd, uSunDir), 0.0), 5.0);
  return mix(uFogCol, uFogCol*0.5 + uSunCol*0.3, s);
}
vec3 applyFog(vec3 col, vec3 wp){
  vec3 v = wp - cameraPosition; float dist = length(v); vec3 rd = v / max(dist, 1e-4);
  float b = uHFogB;
  float y0 = cameraPosition.y - uHFogH;
  float y1 = wp.y - uHFogH;
  float e0 = exp(-b*clamp(y0, -6.0, 40.0));
  float e1 = exp(-b*clamp(y1, -6.0, 40.0));
  float dy = wp.y - cameraPosition.y;
  float hf = abs(dy) > 0.01 ? uHFogA * dist * (e0 - e1) / (b * dy) : uHFogA * dist * e0;
  float patchy = mix(1.0, 0.25 + 1.5*lt_noise(wp.xz*0.11 + vec2(uTime*0.035, uTime*0.013)), uFogPatch);
  hf *= patchy;
  float tot = 1.0 - exp(-(dist*uFogDens + max(hf, 0.0)));
  return mix(col, fogColAt(rd), clamp(tot, 0.0, 1.0));
}`;

const GLSL_HEX = /* glsl */`
uniform vec3 uTouch; uniform float uTouchAmt; uniform float uHexW;
float hexDist(vec2 p){ p = abs(p); return max(dot(p, vec2(0.5, 0.8660254)), p.x); }
vec4 hexCoords(vec2 uv){ vec2 r = vec2(1.0, 1.7320508); vec2 h = r*0.5;
  vec2 a = mod(uv, r) - h; vec2 b = mod(uv - h, r) - h;
  vec2 gv = dot(a,a) < dot(b,b) ? a : b; return vec4(gv, uv - gv); }`;

/* Ground detail, drawn per pixel: grass and sandy patches, crop rows, dirt roads with wheel ruts, railway ballast. */
const f1 = (v) => v.toFixed(4);
const GLSL_GROUND_DETAIL = /* glsl */`{
  vec2 xz = vWPos.xz;
  float n1 = lt_noise(xz*1.3);
  float n2 = lt_noise(xz*5.1 + 3.0);
  float n3 = lt_noise(xz*21.0 + 9.0);
  // open ground: mown grass and sandy dirt patches
  float pm = lt_noise(xz*0.3 + 7.0)*0.6 + n1*0.4;
  vec3 grassC = vec3(0.16, 0.21, 0.07) * (0.85 + 0.3*n2);
  vec3 sandC = vec3(0.40, 0.32, 0.18) * (0.9 + 0.2*n2);
  vec3 openC = mix(grassC, sandC, smoothstep(0.44, 0.64, pm));
  diffuseColor.rgb = mix(diffuseColor.rgb, openC, vKind.x * uSandy);
  // fields: crop rows, faded out where they would shimmer
  vec2 fr = vec2(xz.x*0.9394 - xz.y*0.3429, xz.x*0.3429 + xz.y*0.9394);
  vec2 fid = floor(fr / vec2(2.3, 1.5));
  float along = lt_hash(fid + 0.5) > 0.5 ? fr.x : fr.y;
  float rowsW = 0.5 + 0.5*sin(along * 30.0);
  float fadeR = 1.0 - smoothstep(0.8, 2.0, fwidth(along) * 30.0);
  diffuseColor.rgb *= 1.0 + (rowsW - 0.5) * 0.35 * vKind.y * fadeR;
  diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(1.18, 1.12, 1.0) + vec3(0.02, 0.015, 0.0), vKind.y * uSandy * 0.6);
  // roads and railway bed
  float gx = xz.x, gz = xz.y;
  float rz = 3.2*sin(gx*0.11+0.4) + 1.3*sin(gx*0.29+1.7);
  float rdz = 0.352*cos(gx*0.11+0.4) + 0.377*cos(gx*0.29+1.7);
  float roadZc = rz + 2.4 + 0.5*sin(gx*0.17);
  float rdz2 = rdz + 0.085*cos(gx*0.17);
  float roadD = abs(gz - roadZc) / sqrt(1.0 + rdz2*rdz2);
  float sideD = (gz > ${f1(roadZ(BX) + 0.1)} || gz < ${f1(BZ - 9)}) ? 99.0
    : abs(gx - (${f1(BX)} + ${f1(SIDE_K)}*(gz - ${f1(BZ)}))) / ${f1(Math.sqrt(1 + SIDE_K * SIDE_K))};
  float railD = abs(gz - (rz - 2.8)) / sqrt(1.0 + rdz*rdz);
  vec3 dirtC = vec3(0.30, 0.25, 0.17) * (0.9 + 0.2*n2);
  float roadM = (1.0 - smoothstep(0.13, 0.15 + fwidth(roadD)*1.5, roadD)) * step(abs(gx), 40.0);
  float sideM = 1.0 - smoothstep(0.09, 0.11 + fwidth(sideD)*1.5, sideD);
  float ruts = (1.0 - smoothstep(0.012, 0.03, abs(roadD - 0.065))) * roadM
             + (1.0 - smoothstep(0.010, 0.025, abs(sideD - 0.045))) * sideM;
  diffuseColor.rgb = mix(diffuseColor.rgb, dirtC, max(roadM, sideM));
  diffuseColor.rgb *= 1.0 - 0.3 * ruts;
  float railM = 1.0 - smoothstep(0.17, 0.19 + fwidth(railD)*1.5, railD);
  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.20, 0.19, 0.17) * (0.8 + 0.4*n3), railM * step(abs(gx), 40.0));
  diffuseColor.rgb *= 0.88 + 0.14*n2 + 0.08*n3;
}`;

/* Adds our fog (and optional wind, wet ground, hex grid) to a standard three.js material. */
function patch(mat, opt = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        uniform float uTime; uniform float uWind;
        ${opt.wet ? 'attribute float aWet; varying float vWet;' : ''}
        ${opt.ground ? 'attribute vec4 aKind; varying vec4 vKind;' : ''}
        ${opt.tuft ? 'uniform float uTuftFar;' : ''}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        ${opt.wind ? `{
          #ifdef USE_INSTANCING
            vec2 ip = vec2(instanceMatrix[3].x, instanceMatrix[3].z);
          #else
            vec2 ip = vec2(0.0);
          #endif
          float gust = 0.55 + 0.45*sin(uTime*0.7 - (ip.x*0.8 + ip.y*0.5)*0.18);
          float sway = (sin(uTime*1.9 + ip.x*0.7 + ip.y*0.4) + 0.45*sin(uTime*3.3 + ip.x*1.7)) * gust * uWind;
          float k = max(transformed.y, 0.0); k *= k;
          transformed.x += sway * k * 0.07;
          transformed.z += sway * k * 0.035;
        }` : ''}
        ${opt.tuft ? `{
          #ifdef USE_INSTANCING
            vec3 ipos = (modelMatrix * vec4(instanceMatrix[3].xyz, 1.0)).xyz;
            transformed *= 1.0 - smoothstep(uTuftFar * 0.6, uTuftFar, distance(cameraPosition, ipos));
          #endif
        }` : ''}`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        { vec4 wp4 = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            wp4 = instanceMatrix * wp4;
          #endif
          vWPos = (modelMatrix * wp4).xyz; }
        ${opt.wet ? 'vWet = aWet;' : ''}
        ${opt.ground ? 'vKind = aKind;' : ''}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos;
        ${opt.wet ? 'varying float vWet;' : ''}
        ${opt.ground ? 'varying vec4 vKind; uniform float uSandy;' : ''}
        ${GLSL_FOG}
        ${opt.hex ? GLSL_HEX : ''}`)
      .replace('#include <fog_fragment>', `gl_FragColor.rgb = applyFog(gl_FragColor.rgb, vWPos);`);
    if (opt.ground) sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      ${GLSL_GROUND_DETAIL}`);
    if (opt.wet) {
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <color_fragment>', `#include <color_fragment>
          diffuseColor.rgb *= 1.0 - 0.28*vWet;`)
        .replace('#include <roughnessmap_fragment>', `float roughnessFactor = roughness * (1.0 - 0.42*vWet);`);
    }
    if (opt.hex) {
      sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', `#include <opaque_fragment>
        if (uTouchAmt > 0.001) {
          vec4 hc = hexCoords(vWPos.xz / uHexW);
          float e = 0.5 - hexDist(hc.xy);
          float fw = fwidth(e);
          float line = 1.0 - smoothstep(fw*0.5, fw*1.5 + 0.008, e);
          vec4 tc = hexCoords(uTouch.xz / uHexW);
          float sel = 1.0 - step(0.05, length(tc.zw - hc.zw));
          float r = length(vWPos.xz - uTouch.xz);
          float m = uTouchAmt * (1.0 - smoothstep(uHexW*1.3, uHexW*3.3, r));
          vec3 lc = vec3(1.0, 0.88, 0.62) * 1.5;
          gl_FragColor.rgb = mix(gl_FragColor.rgb, lc, line * m * 0.65);
          gl_FragColor.rgb += lc * 0.10 * sel * uTouchAmt;
        }`);
    }
  };
  return mat;
}
function patchDepth(mat) {   // wind in the shadow pass too, so shadows sway with the trees
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uWind = U.uWind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uWind;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        { vec2 ip = vec2(instanceMatrix[3].x, instanceMatrix[3].z);
          float gust = 0.55 + 0.45*sin(uTime*0.7 - (ip.x*0.8 + ip.y*0.5)*0.18);
          float sway = (sin(uTime*1.9 + ip.x*0.7 + ip.y*0.4) + 0.45*sin(uTime*3.3 + ip.x*1.7)) * gust * uWind;
          float k = max(transformed.y, 0.0); k *= k;
          transformed.x += sway * k * 0.07; transformed.z += sway * k * 0.035; }`);
  };
  return mat;
}

/* ============================================================
   3. LIGHTS
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

/* ============================================================
   4. SKY
   ============================================================ */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `${GLSL_FOG}
      uniform vec3 uZenith; uniform vec3 uHorizon; varying vec3 vDir;
      void main(){
        vec3 rd = normalize(vDir);
        float y = max(rd.y, 0.0);

    vertexShader: `attribute float aSeed; uniform float uTime; uniform float uPx; uniform vec3 uSunDir;
      varying float vA; varying vec3 vWPos; varying float vLit;
      void main(){

    fragmentShader: `${GLSL_FOG}

})();

  P.uExposure.value = cur.exposure; P.uSat.value = cur.sat; P.uContrast.value = cur.contrast; P.uVig.value = cur.vig;
  P.uBloom.value = cur.bloom; P.uBloomThr.value = cur.bloomThr; P.uTilt.value = cur.tilt; P.uSoft.value = cur.soft;
  P.uPaint.value = cur.paint; P.uGrain.value = cur.grain; P.uLift.value.set(...cur.lift); P.uGain.value.set(...cur.gain);
}

/* ============================================================
   13. FINAL PASS: tone mapping, colour grade, bloom, tilt-shift
   ============================================================ */
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false;
const quadScene = new THREE.Scene(); quadScene.add(quad);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const rtType = canHalf ? THREE.HalfFloatType : THREE.UnsignedByteType;
const rtScene = new THREE.WebGLRenderTarget(1, 1, { type: rtType, samples: 4 });
const rtA = new THREE.WebGLRenderTarget(1, 1, { type: rtType, depthBuffer: false });
const rtB = new THREE.WebGLRenderTarget(1, 1, { type: rtType, depthBuffer: false });
const downMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() } }, vertexShader: FS_VERT,
  fragmentShader: `uniform sampler2D tSrc; uniform vec2 uTexel; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tSrc, vUv + uTexel*vec2(-1,-1)).rgb + texture2D(tSrc, vUv + uTexel*vec2(1,-1)).rgb
      + texture2D(tSrc, vUv + uTexel*vec2(-1,1)).rgb + texture2D(tSrc, vUv + uTexel*vec2(1,1)).rgb;
      gl_FragColor = vec4(min(c*0.25, vec3(16.0)), 1.0); }`,
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } }, vertexShader: FS_VERT,
  fragmentShader: `uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tSrc, vUv).rgb * 0.227;
      c += (texture2D(tSrc, vUv + uDir*1.385).rgb + texture2D(tSrc, vUv - uDir*1.385).rgb) * 0.316;
      c += (texture2D(tSrc, vUv + uDir*3.231).rgb + texture2D(tSrc, vUv - uDir*3.231).rgb) * 0.070;
      gl_FragColor = vec4(c, 1.0); }`,
});
const post = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rtScene.texture }, tBlur: { value: rtA.texture }, uRes: { value: new THREE.Vector2() }, uTime: U.uTime,
    uExposure: { value: 1 }, uSat: { value: 1 }, uContrast: { value: 1 }, uVig: { value: 0 }, uBloom: { value: 0 }, uBloomThr: { value: 1 },
    uTilt: { value: 0 }, uTiltCenter: { value: 0.47 }, uSoft: { value: 0 }, uPaint: { value: 0 }, uGrain: { value: 0 },
    uLift: { value: new THREE.Vector3() }, uGain: { value: new THREE.Vector3(1, 1, 1) },
  },
  vertexShader: FS_VERT,
  fragmentShader: `uniform sampler2D tScene; uniform sampler2D tBlur; uniform vec2 uRes; uniform float uTime;
    uniform float uExposure, uSat, uContrast, uVig, uBloom, uBloomThr, uTilt, uTiltCenter, uSoft, uPaint, uGrain;
    uniform vec3 uLift, uGain; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
    vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    float h21(vec2 p){ p = fract(p*vec2(233.34, 851.73)); p += dot(p, p+23.45); return fract(p.x*p.y); }
    float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
    void main(){
      vec2 uv = vUv;
      if (uPaint > 0.01) {   // tiny brush-like wobble of the image
        vec2 px = uv * uRes / 7.0;
        uv += (vec2(vn(px), vn(px + 17.0)) - 0.5) * 2.2 / uRes * uPaint;
      }
      vec3 c = texture2D(tScene, uv).rgb;
      vec3 b = texture2D(tBlur, uv).rgb;
      float ty = abs(vUv.y - uTiltCenter);
      c = mix(c, b, smoothstep(0.16, 0.48, ty) * uTilt * 0.85);
      c = mix(c, b, uSoft);
      vec3 bl = max(b - uBloomThr, 0.0);
      c += bl * uBloom;
      c = aces(c * uExposure);
      c = c * uGain + uLift * (1.0 - c);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, uSat);
      c = toSRGB(clamp(c, 0.0, 1.0));
      c = clamp((c - 0.5) * uContrast + 0.5, 0.0, 1.0);
      if (uPaint > 0.01) {
        vec3 q = floor(c * 9.0 + 0.5) / 9.0;
        c = mix(c, q, 0.28 * uPaint);
        c *= 1.0 + (vn(gl_FragCoord.xy / 3.0) - 0.5) * 0.06 * uPaint;   // paper texture
      }
      vec2 d = vUv - 0.5; d.x *= uRes.x / uRes.y;
      c *= 1.0 - uVig * smoothstep(0.25, 1.1, length(d) * 1.4);
      c += (h21(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) * uGrain;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
function fsPass(mat, rt) { quad.material = mat; renderer.setRenderTarget(rt); renderer.render(quadScene, quadCam); }

/* ============================================================
   14. CAMERA: drag to turn, pinch to zoom, swoop low when close
   ============================================================ */
const cam = { yaw: -2.25, pitchOff: 0, dist: 40, tx: 0, tz: riverZ(0) + 1.2 };
let camAnim = null;
const DMIN = 2.6, DMAX = 72;
// the further out you zoom, the higher the camera tilts; each look sets how high (look D: tabletop view)
function autoPitch(dist) { const t = smooth(0, 1, (dist - DMIN) / (DMAX - DMIN)); return mix(0.1, cur.pitchMax, Math.pow(t, 0.7)); }
let groundY = height(cam.tx, cam.tz), camPitchUsed = 0.5;
function updateCamera(dt) {
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / camAnim.dur);
    const e = camAnim.t < 0.5 ? 4 * camAnim.t ** 3 : 1 - Math.pow(-2 * camAnim.t + 2, 3) / 2;
    for (const k of ['yaw', 'pitchOff', 'dist', 'tx', 'tz']) cam[k] = mix(camAnim.from[k], camAnim.to[k], e);
    if (camAnim.t >= 1) camAnim = null;
  }
  cam.tx = Math.max(-22, Math.min(22, cam.tx)); cam.tz = Math.max(-22, Math.min(22, cam.tz));
  cam.dist = Math.max(DMIN, Math.min(DMAX, cam.dist));
  let pitch = Math.max(0.04, Math.min(1.35, autoPitch(cam.dist) + cam.pitchOff));
  groundY += (Math.max(height(cam.tx, cam.tz), floorY(cam.tx)) - groundY) * Math.min(1, dt * 4);
  const ty = groundY + 0.3;
  // keep the camera out of hills and treetops: tilt up until the line of sight is clear
  const dist = cam.dist * cur.distMul;   // narrower lenses sit further back so the view covers the same ground
  let px, py, pz;
  for (let it = 0; it < 40; it++) {
    const cp = Math.cos(pitch);
    px = cam.tx + Math.cos(cam.yaw) * cp * dist; pz = cam.tz + Math.sin(cam.yaw) * cp * dist;
    py = ty + Math.sin(pitch) * dist;
    let clear = py > height(px, pz) + 0.35 + 1.5 * forestAmount(px, pz);
    for (let f = 0.25; clear && f < 0.95; f += 0.25) {
      const sx = mix(px, cam.tx, f), sz = mix(pz, cam.tz, f);
      clear = mix(py, ty, f) > height(sx, sz) + 0.2;
    }
    if (clear || pitch > 1.3) break;
    pitch += 0.03;
  }
  camPitchUsed += (pitch - camPitchUsed) * Math.min(1, dt * 5);
  { const cp = Math.cos(camPitchUsed);
    px = cam.tx + Math.cos(cam.yaw) * cp * dist; pz = cam.tz + Math.sin(cam.yaw) * cp * dist;
    py = Math.max(ty + Math.sin(camPitchUsed) * dist, height(px, pz) + 0.3); }
  camera.position.set(px, py, pz);
  camera.lookAt(cam.tx, ty, cam.tz);
}
function flyTo(to, dur = 1.6) { camAnim = { t: 0, dur, from: { ...cam }, to: { ...cam, ...to } }; }
const VIEWS = {
  over: { dist: 40, pitchOff: 0, tx: 0, tz: riverZ(0) + 1.2, yaw: -2.25 },
  low:  { dist: 4.2, pitchOff: 0.02, tx: -2.2, tz: roadZ(-2.2) - 0.9, yaw: -2.75 },
};
document.getElementById('vOver').addEventListener('click', () => flyTo(VIEWS.over));
document.getElementById('vLow').addEventListener('click', () => flyTo(VIEWS.low, 2.2));

// touch picking: march a ray from the camera onto the land
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster();
function pickGround(clientX, clientY) {
  ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  let prev = 0;
  for (let t = 0.2; t < 140; t += 0.25 + t * 0.01) {
    const x = o.x + d.x * t, z = o.z + d.z * t, y = o.y + d.y * t;
    if (y < height(x, z)) {
      let lo = prev, hi = t;
      for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; (o.y + d.y * m < height(o.x + d.x * m, o.z + d.z * m)) ? hi = m : lo = m; }
      return new THREE.Vector3(o.x + d.x * hi, o.y + d.y * hi, o.z + d.z * hi);
    }
    prev = t;
  }
  return null;
}
let touchHeld = false, touchFade = 0;
function showHexAt(p) { if (p) { U.uTouch.value.copy(p); touchHeld = true; } }

const pointers = new Map();
let lastPinch = null;
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  camAnim = null; lastPinch = null;
  if (pointers.size === 1) showHexAt(pickGround(e.clientX, e.clientY));
  hideHint();
});
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    cam.yaw += dx * 0.0065;
    cam.pitchOff = Math.max(-0.35, Math.min(0.45, cam.pitchOff + dy * 0.004));
    showHexAt(pickGround(e.clientX, e.clientY));
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (lastPinch) {
      cam.dist *= lastPinch.dist / Math.max(dist, 1);
      const pdx = mx - lastPinch.mx, pdy = my - lastPinch.my, s = cam.dist * cur.distMul * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * 0.0047;
      const fx = -Math.cos(cam.yaw), fz = -Math.sin(cam.yaw);
      // fingers drag the land: move the view centre opposite to the "right" direction, along "forward" for up/down
      cam.tx += (fz * pdx + fx * pdy) * s; cam.tz += (-fx * pdx + fz * pdy) * s;
    }
    lastPinch = { dist, mx, my };
    touchHeld = false;
  }
});
const endPointer = (e) => { pointers.delete(e.pointerId); lastPinch = null; if (pointers.size === 0) touchHeld = false; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); camAnim = null; cam.dist *= Math.exp(e.deltaY * 0.0012); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());   // stop Safari page zoom

const hint = document.getElementById('hint');
let hintGone = false;
function hideHint() { if (!hintGone) { hintGone = true; hint.style.opacity = 0; } }
setTimeout(hideHint, 9000);

/* ============================================================
   15. SIZE, RESOLUTION AND THE FRAME LOOP
   ============================================================ */
const MAX_PR = Math.min(window.devicePixelRatio || 1, 2);
let pr = FIXED_PR || MAX_PR;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(pr); renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const W = Math.floor(w * pr), H = Math.floor(h * pr);
  rtScene.setSize(W, H);
  const qw = Math.max(1, Math.floor(W / 4)), qh = Math.max(1, Math.floor(H / 4));
  rtA.setSize(qw, qh); rtB.setSize(qw, qh);
  downMat.uniforms.uTexel.value.set(1 / W, 1 / H);
  post.uniforms.uRes.value.set(W, H);
  smoke.material.uniforms.uPx.value = H * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
}
addEventListener('resize', resize);
resize();

const stats = document.getElementById('stats');
const frameMs = [], sceneInfo = { calls: 0, tris: 0 };
let lastT = performance.now(), lastAdjust = lastT, frames = 0;
window.__lt = { setLook, flyTo, VIEWS, cam, showHexAt: (x, z) => { U.uTouch.value.set(x, height(x, z), z); touchHeld = true; touchFade = 1; },
  hideHex: () => { touchHeld = false; touchFade = 0; }, stats: () => ({ avgMs: frameMs.reduce((a, b) => a + b, 0) / Math.max(1, frameMs.length), pr, frames,
  trees: treeSpots.spruce.length + treeSpots.broad.length, calls: sceneInfo.calls, tris: sceneInfo.tris, props: window.__propCounts, houses: houses.length, halfFloat: canHalf }),
  snapLook: (n) => { setLook(n); Object.assign(cur, JSON.parse(JSON.stringify(LOOKS[n]))); } };

try { const saved = localStorage.getItem('lt-look2'); if (saved && LOOKS[saved]) { setLook(saved); Object.assign(cur, JSON.parse(JSON.stringify(LOOKS[saved]))); } } catch (e) {}

function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT) / 1000);
  frameMs.push(now - lastT); if (frameMs.length > 60) frameMs.shift();
  lastT = now; frames++;
  U.uTime.value += dt;

  lerpLook(1 - Math.exp(-dt * 5));
  applyLook();
  touchFade += ((touchHeld ? 1 : 0) - touchFade) * Math.min(1, dt * (touchHeld ? 8 : 1.6));
  U.uTouchAmt.value = touchFade;
  updateCamera(dt);
  sky.position.copy(camera.position);

  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  sceneInfo.calls = renderer.info.render.calls; sceneInfo.tris = renderer.info.render.triangles;
  downMat.uniforms.tSrc.value = rtScene.texture; fsPass(downMat, rtA);
  for (let i = 0; i < 2; i++) {
    blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.uDir.value.set(1.6 / rtA.width, 0); fsPass(blurMat, rtB);
    blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, 1.6 / rtA.height); fsPass(blurMat, rtA);
  }
  fsPass(post, null);

  // labels on the placeholder tanks
  tanks.forEach((t, i) => {
    const p = t.userData.center.clone(); p.y += 0.45; p.project(camera);
    const el = tagEls[i];
    if (p.z > 1 || Math.abs(p.x) > 1.1 || Math.abs(p.y) > 1.1 || cam.dist > 34) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.transform = `translate(${(p.x * 0.5 + 0.5) * innerWidth}px, ${(-p.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
  });

  // resolution control: keep the phone smooth (drop sharpness if a frame takes too long)
  if (!FIXED_PR && now - lastAdjust > 2500 && frameMs.length >= 60) {
    const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
    if (avg > 38 && pr > 1) { pr = Math.max(1, pr - 0.25); resize(); lastAdjust = now; }
    else if (avg < 20 && pr < MAX_PR && now - lastAdjust > 8000) { pr = Math.min(MAX_PR, pr + 0.25); resize(); lastAdjust = now; }
  }
  if (frames % 15 === 0) {
    const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
    stats.textContent = `${Math.round(1000 / avg)} fps · sharpness ${pr.toFixed(2)}x`;
  }
}
renderer.setAnimationLoop(frame);
window.__lt.pause = () => renderer.setAnimationLoop(null);
window.__lt.resume = () => { lastT = performance.now(); renderer.setAnimationLoop(frame); };
</script>
