<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cold War Hex - Test Page</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #msg { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0); padding: 14px 16px;
         color: #e8eef5; font: 600 17px/1.3 -apple-system, system-ui, sans-serif; text-align: center;
         text-shadow: 0 1px 3px #000; pointer-events: none; }
  #msg small { display: block; font-weight: 400; opacity: .75; margin-top: 4px; }
</style>
</head>
<body>
<div id="msg">Hello. If you see a spinning hexagon, 3D works on this phone.<small id="info"></small></div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2430);
scene.fog = new THREE.Fog(0x1b2430, 6, 16);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
camera.position.set(0, 3.2, 5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xbcd2ff, 0x3a2c1f, 0.7));
const sun = new THREE.DirectionalLight(0xffc98a, 2.2);
sun.position.set(-4, 3, 2);
scene.add(sun);

const hex = new THREE.Mesh(
  new THREE.CylinderGeometry(1.5, 1.5, 0.6, 6),
  new THREE.MeshStandardMaterial({ color: 0x6f8f4e, roughness: 0.9 })
);
scene.add(hex);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // Pull the camera back far enough that the hexagon always fits the screen width (portrait phones are narrow).
  const halfH = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const dist = Math.max(5, 2.1 / Math.tan(halfH));
  camera.position.set(0, dist * 0.55, dist * 0.83);
  camera.lookAt(0, 0, 0);
}
window.addEventListener('resize', resize);
resize();

document.getElementById('info').textContent =
  'three.js r' + THREE.REVISION + ' | ' + window.innerWidth + 'x' + window.innerHeight;

renderer.setAnimationLoop((t) => {
  hex.rotation.y = t * 0.0006;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
